<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project Pulse: a dashboard showing status, priority and recent activity for every project.">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <h1>Project Pulse</h1>
      <p class="dashboard-subtitle">Status, priority and recent activity for every project on Mona's team.</p>
    </header>

    <section class="dashboard-summary" aria-label="Project counts by status">
      <p class="summary-stat summary-stat--on-track" data-status="on-track"><strong data-count>0</strong> <span>On Track</span></p>
      <p class="summary-stat summary-stat--at-risk" data-status="at-risk"><strong data-count>0</strong> <span>At Risk</span></p>
      <p class="summary-stat summary-stat--blocked" data-status="blocked"><strong data-count>0</strong> <span>Blocked</span></p>
      <p class="summary-stat summary-stat--completed" data-status="completed"><strong data-count>0</strong> <span>Completed</span></p>
    </section>

    <p class="dashboard-message" role="status" aria-live="polite">Loading projects…</p>

    <noscript>
      <p class="dashboard-message">Project Pulse needs JavaScript to load project data. Please enable JavaScript and reload the page.</p>
    </noscript>

    <section class="project-grid" aria-label="Projects"></section>
  </main>

  <!-- Card markup: fields name, owner, status, recentActivity, priority, summary, progress, lastUpdated -->
  <template id="project-card-template">
    <article class="project-card" data-status="unknown" data-priority="unknown">
      <div class="project-card__header">
        <h2 class="project-name"></h2>
        <span class="status-badge status-badge--unknown"></span>
      </div>
      <p class="project-owner"></p>
      <span class="priority-badge priority-badge--unknown"></span>
      <p class="project-activity"><strong>Recent activity</strong> <span data-field="recentActivity"></span></p>
      <p class="project-summary"></p>
      <div class="project-progress">
        <progress max="100" value="0"></progress>
        <span data-field="progress"></span>
      </div>
      <p class="project-updated">Last updated <time datetime=""></time></p>
    </article>
  </template>

  <script>
    (function () {
      "use strict";

      var DATA_URL = "project-data.json";
      var MISSING = "—";
      var KNOWN_STATUSES = ["on-track", "at-risk", "blocked", "completed"];
      var KNOWN_PRIORITIES = ["high", "medium", "low"];

      var messageElement = document.querySelector(".dashboard-message");
      var gridElement = document.querySelector(".project-grid");
      var template = document.getElementById("project-card-template");

      function showMessage(text, state) {
        messageElement.textContent = text;
        messageElement.hidden = false;
        if (state) {
          messageElement.setAttribute("data-state", state);
        } else {
          messageElement.removeAttribute("data-state");
        }
      }

      function hideMessage() {
        messageElement.textContent = "";
        messageElement.hidden = true;
        messageElement.removeAttribute("data-state");
      }

      function isNonEmptyString(value) {
        return typeof value === "string" && value.trim() !== "";
      }

      function textOrMissing(value) {
        return isNonEmptyString(value) ? value.trim() : MISSING;
      }

      // "At Risk", "at risk", " AT_RISK " -> "at-risk"
      function toSlug(value) {
        if (!isNonEmptyString(value)) {
          return "";
        }
        return value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      function knownSlugOrUnknown(value, knownSlugs) {
        var slug = toSlug(value);
        return knownSlugs.indexOf(slug) === -1 ? "unknown" : slug;
      }

      function readProgress(value) {
        var number = typeof value === "string" && value.trim() !== "" ? Number(value) : value;
        if (typeof number !== "number" || !isFinite(number)) {
          return null;
        }
        return Math.min(100, Math.max(0, Math.round(number)));
      }

      function isIsoDate(value) {
        return isNonEmptyString(value) && /^\d{4}-\d{2}-\d{2}$/.test(value.trim());
      }

      function buildCard(project) {
        var fragment = template.content.cloneNode(true);
        var card = fragment.querySelector(".project-card");

        var name = textOrMissing(project.name);
        var statusSlug = knownSlugOrUnknown(project.status, KNOWN_STATUSES);
        var prioritySlug = knownSlugOrUnknown(project.priority, KNOWN_PRIORITIES);

        card.setAttribute("data-status", statusSlug);
        card.setAttribute("data-priority", prioritySlug);
        if (isNonEmptyString(project.id)) {
          card.id = "project-" + toSlug(project.id);
        }

        card.querySelector(".project-name").textContent = name;

        var statusBadge = card.querySelector(".status-badge");
        statusBadge.className = "status-badge status-badge--" + statusSlug;
        statusBadge.textContent = textOrMissing(project.status);

        card.querySelector(".project-owner").textContent = "Owner: " + textOrMissing(project.owner);

        var priorityBadge = card.querySelector(".priority-badge");
        priorityBadge.className = "priority-badge priority-badge--" + prioritySlug;
        priorityBadge.textContent = isNonEmptyString(project.priority)
          ? project.priority.trim() + " priority"
          : "Priority: " + MISSING;

        card.querySelector('.project-activity [data-field="recentActivity"]').textContent =
          textOrMissing(project.recentActivity);

        var summaryElement = card.querySelector(".project-summary");
        if (isNonEmptyString(project.summary)) {
          summaryElement.textContent = project.summary.trim();
        } else {
          summaryElement.remove();
        }

        var progressWrapper = card.querySelector(".project-progress");
        var progressValue = readProgress(project.progress);
        if (progressValue === null) {
          progressWrapper.remove();
        } else {
          var progressBar = progressWrapper.querySelector("progress");
          progressBar.value = progressValue;
          progressBar.textContent = progressValue + "%";
          progressBar.setAttribute("aria-label", "Progress for " + name);
          progressWrapper.querySelector('[data-field="progress"]').textContent = progressValue + "% complete";
        }

        var updatedElement = card.querySelector(".project-updated");
        if (isIsoDate(project.lastUpdated)) {
          var timeElement = updatedElement.querySelector("time");
          timeElement.setAttribute("datetime", project.lastUpdated.trim());
          timeElement.textContent = project.lastUpdated.trim();
        } else {
          updatedElement.remove();
        }

        return fragment;
      }

      function updateSummary(projects) {
        var counts = { "on-track": 0, "at-risk": 0, "blocked": 0, "completed": 0 };
        projects.forEach(function (project) {
          var slug = knownSlugOrUnknown(project && project.status, KNOWN_STATUSES);
          if (counts.hasOwnProperty(slug)) {
            counts[slug] += 1;
          }
        });
        document.querySelectorAll(".summary-stat").forEach(function (tile) {
          var slug = tile.getAttribute("data-status");
          tile.querySelector("[data-count]").textContent = String(counts[slug] || 0);
        });
      }

      function render(projects) {
        gridElement.replaceChildren();
        updateSummary(projects);

        if (projects.length === 0) {
          showMessage("No projects yet. Add a project to project-data.json to see it here.", "empty");
          return;
        }

        projects.forEach(function (project) {
          var safeProject = project && typeof project === "object" ? project : {};
          gridElement.appendChild(buildCard(safeProject));
        });
        hideMessage();
      }

      function showLoadError(error) {
        console.error("Project Pulse could not load " + DATA_URL + ":", error);
        var openedAsFile = window.location.protocol === "file:";
        var hint = openedAsFile
          ? "This page was opened as a local file:// page, so the browser blocked loading the data. "
          : "";
        showMessage(
          "Could not load project data. " + hint +
          "Open the dashboard with the \"Run Project Pulse Dashboard\" launch configuration in VS Code (Run and Debug) " +
          "instead of opening the file directly, and check that project-data.json is valid JSON.",
          "error"
        );
      }

      function loadProjects() {
        showMessage("Loading projects…", "loading");
        fetch(DATA_URL, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("HTTP " + response.status + " while requesting " + DATA_URL);
            }
            return response.json();
          })
          .then(function (data) {
            if (!data || !Array.isArray(data.projects)) {
              throw new Error(DATA_URL + " must contain a top-level \"projects\" array");
            }
            render(data.projects);
          })
          .catch(showLoadError);
      }

      loadProjects();
    })();
  </script>
</body>
</html>
